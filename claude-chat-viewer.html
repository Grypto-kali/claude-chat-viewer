<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4ef;
    --sidebar-bg: #1a1a1a;
    --sidebar-text: #e0dfd8;
    --sidebar-muted: #888;
    --sidebar-hover: #2a2a2a;
    --sidebar-active: #333;
    --surface: #ffffff;
    --text: #1a1a18;
    --text-muted: #666;
    --border: rgba(0,0,0,0.08);
    --human-bg: #f0efe8;
    --assistant-bg: #ffffff;
    --code-bg: #1e1e1e;
    --code-text: #d4d4d4;
    --accent: #c96a3a;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --text: #e8e7e0;
      --text-muted: #888;
      --border: rgba(255,255,255,0.08);
      --human-bg: #242422;
      --assistant-bg: #1c1c1a;
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s ease;
  }

  #sidebar.collapsed { width: 0; min-width: 0; }

  .sidebar-header {
    padding: 1.25rem 1rem 0.75rem;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .sidebar-header h1 {
    font-size: 13px;
    font-weight: 500;
    color: var(--sidebar-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
  }

  #search {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--sidebar-text);
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
  }

  #search::placeholder { color: var(--sidebar-muted); }
  #search:focus { border-color: rgba(255,255,255,0.25); }

  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
  }

  #conv-list::-webkit-scrollbar { width: 4px; }
  #conv-list::-webkit-scrollbar-track { background: transparent; }
  #conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }


  .conv-item {
    padding: 0.6rem 1rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.1s;
  }

  .conv-item:hover { background: var(--sidebar-hover); }
  .conv-item.active { background: var(--sidebar-active); }

  .conv-name {
    font-size: 13px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .conv-meta {
    font-size: 11px;
    color: var(--sidebar-muted);
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1.5rem;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  #toggle-sidebar {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    transition: background 0.1s;
  }

  #toggle-sidebar:hover { background: var(--bg); }

  #conv-title {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #msg-count {
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  #chat-area::-webkit-scrollbar { width: 6px; }
  #chat-area::-webkit-scrollbar-track { background: transparent; }
  #chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 0.75rem;
    padding: 1.25rem 0;
    border-bottom: 0.5px solid var(--border);
  }

  .msg:last-child { border-bottom: none; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.human .msg-avatar {
    background: #d4a076;
    color: #4a2810;
  }

  .msg.assistant .msg-avatar {
    background: #c96a3a;
    color: #fff;
  }

  .msg-body { flex: 1; min-width: 0; }

  .msg-sender {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 0.375rem;
  }

  .msg-content {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
  }

  .msg-content p { margin-bottom: 0.75rem; }
  .msg-content p:last-child { margin-bottom: 0; }

  .msg-content h1, .msg-content h2, .msg-content h3 {
    font-weight: 500;
    margin: 1rem 0 0.5rem;
    line-height: 1.3;
  }

  .msg-content h1 { font-size: 18px; }
  .msg-content h2 { font-size: 16px; }
  .msg-content h3 { font-size: 14px; }

  .msg-content ul, .msg-content ol {
    padding-left: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .msg-content li { margin-bottom: 0.25rem; }

  .msg-content code {
    font-family: var(--font-mono);
    font-size: 13px;
    background: rgba(0,0,0,0.07);
    padding: 1px 5px;
    border-radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    .msg-content code { background: rgba(255,255,255,0.1); }
  }

  .msg-content pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
    margin: 0.75rem 0;
    position: relative;
  }

  .msg-content pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    font-size: 13px;
    color: var(--code-text);
    line-height: 1.5;
  }

  .msg-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin: 0.75rem 0;
  }

  .msg-content th, .msg-content td {
    border: 0.5px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }

  .msg-content th {
    background: var(--bg);
    font-weight: 500;
    font-size: 12px;
  }

  .msg-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 0.75rem;
    color: var(--text-muted);
    margin: 0.5rem 0;
  }

  .msg-content a { color: var(--accent); }

  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 0.375rem;
  }

  #dropzone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--text-muted);
    text-align: center;
    padding: 2rem;
  }

  #dropzone.drag-over { background: rgba(201,106,58,0.05); }

  .drop-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .drop-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }

  .drop-sub {
    font-size: 14px;
    max-width: 320px;
    line-height: 1.5;
  }

  #file-input { display: none; }

  .drop-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: opacity 0.15s;
  }

  .drop-btn:hover { opacity: 0.85; }

  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .lang-badge {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-header">
    <h1>Conversations</h1>
    <input type="text" id="search" placeholder="Search..." autocomplete="off">
  </div>
  <div id="conv-list"></div>
</nav>

<div id="main">
  <div id="topbar">
    <button id="toggle-sidebar" title="Toggle sidebar">☰</button>
    <span id="conv-title">Load a JSON file</span>
    <span id="msg-count"></span>
  </div>

  <div id="dropzone">
    <div class="drop-icon">💬</div>
    <div class="drop-title">Claude Chat Viewer</div>
    <div class="drop-sub">Load your exported claude.ai JSON file and read your conversations in a clean interface.</div>
    <button class="drop-btn" onclick="document.getElementById('file-input').click()">Choose JSON file</button>
    <input type="file" id="file-input" accept=".json">
  </div>
</div>

<script>
let conversations = [];
let activeIdx = null;

marked.setOptions({ breaks: true, gfm: true });

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function getConvName(conv) {
  if (conv.name && conv.name.trim()) return conv.name;
  const first = conv.chat_messages?.find(m => m.text?.trim() && m.sender === 'human');
  if (first) return first.text.slice(0, 60) + (first.text.length > 60 ? '...' : '');
  return 'Unnamed conversation';
}

function renderSidebar(filter = '') {
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  const lower = filter.toLowerCase();

  conversations.forEach((conv, i) => {
    const name = getConvName(conv);
    if (filter && !name.toLowerCase().includes(lower)) return;

    const item = document.createElement('div');
    item.className = 'conv-item' + (i === activeIdx ? ' active' : '');
    const count = (conv.chat_messages || []).filter(m => m.text?.trim()).length;
    item.innerHTML = `
      <div class="conv-name">${escHtml(name)}</div>
      <div class="conv-meta">${formatDate(conv.updated_at)} · ${count} messages</div>
    `;
    item.addEventListener('click', () => loadConversation(i));
    list.appendChild(item);
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getMessageText(msg) {
  if (msg.text?.trim()) return msg.text;
  if (msg.content) {
    return msg.content
      .filter(c => c.type === 'text' && c.text?.trim())
      .map(c => c.text)
      .join('\n\n');
  }
  return '';
}

function addCodeLangBadges(container) {
  container.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;
    const cls = [...code.classList].find(c => c.startsWith('language-'));
    if (cls) {
      const lang = cls.replace('language-', '');
      const badge = document.createElement('span');
      badge.className = 'lang-badge';
      badge.textContent = lang;
      pre.style.position = 'relative';
      pre.appendChild(badge);
    }
  });
}

function loadConversation(idx) {
  activeIdx = idx;
  const conv = conversations[idx];
  const messages = (conv.chat_messages || []).filter(m => getMessageText(m).trim());

  document.getElementById('conv-title').textContent = getConvName(conv);
  document.getElementById('msg-count').textContent = messages.length + ' messages';

  const main = document.getElementById('main');

  let chatArea = document.getElementById('chat-area');
  if (!chatArea) {
    const dz = document.getElementById('dropzone');
    const es = document.getElementById('empty-state');
    if (dz) dz.remove();
    if (es) es.remove();
    chatArea = document.createElement('div');
    chatArea.id = 'chat-area';
    main.appendChild(chatArea);
  }

  chatArea.innerHTML = '';

  messages.forEach(msg => {
    const isHuman = msg.sender === 'human';
    const text = getMessageText(msg);
    const rendered = marked.parse(text);

    const div = document.createElement('div');
    div.className = 'msg ' + (isHuman ? 'human' : 'assistant');
    div.innerHTML = `
      <div class="msg-avatar">${isHuman ? 'S' : 'C'}</div>
      <div class="msg-body">
        <div class="msg-sender">${isHuman ? 'You' : 'Claude'}</div>
        <div class="msg-content">${rendered}</div>
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      </div>
    `;
    addCodeLangBadges(div);
    chatArea.appendChild(div);
  });

  chatArea.scrollTop = 0;
  renderSidebar(document.getElementById('search').value);
}

function loadJson(data) {
  try {
    const raw = JSON.parse(data);
    if (!Array.isArray(raw)) throw new Error('Not an array');
    conversations = raw.filter(conv =>
      (conv.chat_messages || []).some(m => getMessageText(m).trim())
    );

    const dz = document.getElementById('dropzone');
    const main = document.getElementById('main');

    if (dz) {
      dz.remove();
      const empty = document.createElement('div');
      empty.id = 'empty-state';
      empty.textContent = 'Select a conversation from the left';
      main.appendChild(empty);
    }

    renderSidebar();

    const first = conversations.findIndex(c =>
      (c.chat_messages || []).some(m => getMessageText(m).trim())
    );
    if (first !== -1) loadConversation(first);
  } catch(e) {
    alert('Failed to read JSON file: ' + e.message);
  }
}

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadJson(ev.target.result);
  reader.readAsText(file, 'UTF-8');
});

const dropzone = document.getElementById('dropzone');
document.body.addEventListener('dragover', e => { e.preventDefault(); dropzone?.classList.add('drag-over'); });
document.body.addEventListener('dragleave', () => dropzone?.classList.remove('drag-over'));
document.body.addEventListener('drop', e => {
  e.preventDefault();
  dropzone?.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) return;
  const reader = new FileReader();
  reader.onload = ev => loadJson(ev.target.result);
  reader.readAsText(file, 'UTF-8');
});

document.getElementById('search').addEventListener('input', e => renderSidebar(e.target.value));
document.getElementById('toggle-sidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});
</script>
</body>
</html>
